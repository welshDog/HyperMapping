(function() {

  var MAX_PX = 4096, MIN_FONT_PX = 12;

    Object.keys(BOX).forEach(function(p) {

    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];

    var PAD = {width: ['paddingLeft', 'paddingRight'],

          parseFloat(cs[PAD[p][1]]);
    };

      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {

        set: function(v) {

          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];

              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';

          this['__lumiLast' + p] = n;

/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

      STAGES.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `stage-chip ${s.id === state.currentStage ? 'is-active' : ''}`;
        if (btn) btn.textContent = `${s.id}. ${s.title.split(':')[1].trim().split(' ')[0]}`;
        btn.addEventListener('click', () => {
          stopStreaming();
          setStage(s.id);
        });
        chipsContainer.appendChild(btn);
      });

      // Bind nav buttons
      document.getElementById('btn-prev').addEventListener('click', () => {
        stopStreaming();
        setStage(state.currentStage > 1 ? state.currentStage - 1 : STAGES.length);
      });

      document.getElementById('btn-next').addEventListener('click', () => {
        stopStreaming();
        setStage(state.currentStage < STAGES.length ? state.currentStage + 1 : 1);
      });

      document.getElementById('btn-play').addEventListener('click', toggleStreaming);

      // Node SVG clicks
      STAGES.forEach(s => {
        const nodeEl = document.getElementById(`node-${s.id}`);
        if (nodeEl) {
          nodeEl.addEventListener('click', () => {
            stopStreaming();
            setStage(s.id);
          });
        }
      });

      // Pointer drag interaction on mesh canvas
      const meshCanvas = document.getElementById('meshCanvas');
      meshCanvas.parentElement.addEventListener('pointermove', (e) => {
        if (!e.buttons) return;
        const rect = meshCanvas.getBoundingClientRect();
        state.targetWarpX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        state.targetWarpY = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
        document.getElementById('warp-readout').textContent = `Warp: (${state.targetWarpX.toFixed(2)}, ${state.targetWarpY.toFixed(2)})`;
      });

      setStage(1);
      startMeshAnimation();
    }

    function setStage(stageId) {
      state.currentStage = stageId;
      const stageData = STAGES.find(s => s.id === stageId);
      if (!stageData) return;

      // Update chips
      const chips = document.querySelectorAll('.stage-chip');
      chips.forEach((c, idx) => {
        c.classList.toggle('is-active', idx + 1 === stageId);
      });

      // Update Node SVGs
      STAGES.forEach(s => {
        const group = document.getElementById(`node-${s.id}`);
        const rect = group ? group.querySelector('rect') : null;
        if (rect) {
          if (s.id === stageId) {
            rect.setAttribute('fill', 'var(--accent-container)');
            rect.setAttribute('stroke', 'var(--primary)');
            rect.setAttribute('stroke-width', '2');
          } else if (s.id === 3) {
            rect.setAttribute('fill', 'var(--surface-container)');
            rect.setAttribute('stroke', 'var(--outline)');
            rect.setAttribute('stroke-width', '1');
          } else {
            rect.setAttribute('fill', 'var(--surface-bright)');
            rect.setAttribute('stroke', 'var(--outline)');
            rect.setAttribute('stroke-width', '1');
          }
        }
      });

      // Update Edges
      for (let i = 1; i <= 4; i++) {
        const edge = document.getElementById(`edge-${i}`);
        if (edge) {
          if (i === stageId - 1) {
            edge.setAttribute('stroke', 'var(--primary)');
            edge.setAttribute('stroke-width', '2');
            edge.setAttribute('marker-end', 'url(#lumi-caret-active)');
          } else {
            edge.setAttribute('stroke', 'var(--on-surface)');
            edge.setAttribute('stroke-width', '1.3');
            edge.setAttribute('marker-end', 'url(#lumi-caret)');
          }
        }
      }

      // Animate packet transition
      animatePacket(stageId);

      // Update Inspector
      document.getElementById('stage-title').textContent = stageData.title;
      document.getElementById('stage-meta').textContent = stageData.meta;
      document.getElementById('code-display').innerHTML = stageData.code;

      state.targetWarpX = stageData.warp.x;
      state.targetWarpY = stageData.warp.y;
      document.getElementById('warp-readout').textContent = `Warp: (${stageData.warp.x.toFixed(2)}, ${stageData.warp.y.toFixed(2)})`;
    }

    function animatePacket(stageId) {
      const packet = document.getElementById('data-packet');
      if (!packet) return;

      if (stageId === 1) {
        packet.setAttribute('opacity', '0');
        return;
      }

      const edgeIndex = stageId - 1;
      const xStart = 124 + (edgeIndex - 1) * 128;
      const xEnd = xStart + 16;
      const y = 110;

      packet.setAttribute('opacity', '1');
      let progress = 0;
      
      if (animPacketId) cancelAnimationFrame(animPacketId);

      function step() {
        progress += 0.08;
        if (progress > 1) progress = 1;

        const currentX = xStart + (xEnd - xStart) * progress;
        packet.setAttribute('cx', currentX);
        packet.setAttribute('cy', y);

        if (progress < 1) {
          animPacketId = requestAnimationFrame(step);
        }
      }
      animPacketId = requestAnimationFrame(step);
    }

    function toggleStreaming() {
      state.isStreaming = !state.isStreaming;
      const playBtn = document.getElementById('btn-play');
      if (state.isStreaming) {
        if (playBtn) playBtn.textContent = 'Pause Stream';
        playBtn.classList.remove('lumi-btn--ghost');
        playBtn.classList.add('lumi-btn--accent');
        runStream();
      } else {
        stopStreaming();
      }
    }

    function stopStreaming() {
      state.isStreaming = false;
      const playBtn = document.getElementById('btn-play');
      if (playBtn) {
        if (playBtn) playBtn.textContent = 'Stream (60fps)';
        playBtn.classList.remove('lumi-btn--accent');
        playBtn.classList.add('lumi-btn--ghost');
      }
      if (rafStreamId) {
        cancelAnimationFrame(rafStreamId);
        rafStreamId = null;
      }
    }

    function runStream() {
      let lastTime = performance.now();
      function streamLoop(now) {
        if (!state.isStreaming) return;
        if (now - lastTime > 600) { // Cycle stages automatically
          lastTime = now;
          const nextS = state.currentStage < STAGES.length ? state.currentStage + 1 : 1;
          setStage(nextS);
        }
        rafStreamId = requestAnimationFrame(streamLoop);
      }
      rafStreamId = requestAnimationFrame(streamLoop);
    }

    // Canvas 2D Mesh Renderer
    function startMeshAnimation() {
      const canvas = document.getElementById('meshCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function renderMesh() {
        const box = canvas.parentElement;
        const w = box.clientWidth || 200;
        const h = box.clientHeight || 120;
        const dpr = window.devicePixelRatio || 1;

        if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);

        // Smoothly interpolate warp values
        state.warpX += (state.targetWarpX - state.warpX) * 0.1;
        state.warpY += (state.targetWarpY - state.warpY) * 0.1;

        const cols = 12;
        const rows = 8;
        const padding = 16;
        const gridW = w - padding * 2;
        const gridH = h - padding * 2;

        const primaryColor = getCssVar('--primary') || '#3186ff';
        const outlineColor = getCssVar('--outline') || '#727676';

        ctx.strokeStyle = outlineColor;
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.4;

        // Draw distorted grid wireframe
        for (let r = 0; r <= rows; r++) {
          ctx.beginPath();
          for (let c = 0; c <= cols; c++) {
            const u = c / cols;
            const v = r / rows;

            const baseX = padding + u * gridW;
            const baseY = padding + v * gridH;

            // Distance to warp center
            const dx = u - 0.5;
            const dy = v - 0.5;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const factor = Math.exp(-dist * 4);

            const posX = baseX + state.warpX * 25 * factor;
            const posY = baseY - state.warpY * 20 * factor;

            if (c === 0) ctx.moveTo(posX, posY);
            else ctx.lineTo(posX, posY);
          }
          ctx.stroke();
        }

        for (let c = 0; c <= cols; c++) {
          ctx.beginPath();
          for (let r = 0; r <= rows; r++) {
            const u = c / cols;
            const v = r / rows;

            const baseX = padding + u * gridW;
            const baseY = padding + v * gridH;

            const dx = u - 0.5;
            const dy = v - 0.5;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const factor = Math.exp(-dist * 4);

            const posX = baseX + state.warpX * 25 * factor;
            const posY = baseY - state.warpY * 20 * factor;

            if (r === 0) ctx.moveTo(posX, posY);
            else ctx.lineTo(posX, posY);
          }
          ctx.stroke();
        }

        // Highlight warped center vertex
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = primaryColor;
        const centerX = padding + gridW / 2 + state.warpX * 25;
        const centerY = padding + gridH / 2 - state.warpY * 20;

        ctx.beginPath();
        ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        requestAnimationFrame(renderMesh);
      }

      requestAnimationFrame(renderMesh);
    }

    // Universal Dispatcher
    function updateViz() {
      setStage(state.currentStage);
    }

    // Initialize on ready
    initUI();

    // Theme and Resize Handling
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme);
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
